<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reservar · Casa Humo Chiloé</title>
<meta name="description" content="Reserva tu mesa en Casa Humo Chiloé. Solo 8 mesas por servicio, junto a la laguna Pastahue, Castro.">
<link rel="canonical" href="https://casahumochiloe.cl/reservar/">
<meta name="robots" content="index,follow">
<link rel="icon" type="image/png" href="../assets/img/favicon.png?v=20260721">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png?v=20260721">
<meta property="og:title" content="Reservar · Casa Humo Chiloé">
<meta property="og:description" content="Solo 8 mesas por servicio. Reserva tu lugar junto al fuego.">
<meta property="og:image" content="https://casahumochiloe.cl/assets/img/og-image.jpg">
<meta property="og:url" content="https://casahumochiloe.cl/reservar/">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0b0907; --ash:#15110e; --bone:#d8cdba; --ember:#c1440e; --line:rgba(216,205,186,.18); }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--ink); color:var(--bone);
        font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        display:flex; flex-direction:column; }
  .bar{ display:flex; align-items:center; justify-content:space-between; gap:12px;
        padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top,0px));
        background:var(--ash); border-bottom:1px solid var(--line); flex:0 0 auto; }
  .brand{ display:flex; align-items:center; gap:10px; color:var(--bone); text-decoration:none; }
  .brand img{ height:34px; width:auto; display:block; }
  .brand span{ font-family:"Cormorant Garamond",Georgia,serif; font-size:1.15rem; letter-spacing:.02em; }
  .back{ color:var(--bone); text-decoration:none; font-size:.85rem; letter-spacing:.06em;
         text-transform:uppercase; border:1px solid var(--line); border-radius:999px;
         padding:8px 16px; white-space:nowrap; transition:border-color .2s,color .2s; }
  .back:hover,.back:focus-visible{ border-color:var(--ember); color:#fff; }
  a:focus-visible{ outline:2px solid var(--ember); outline-offset:3px; }
  .frame-wrap{ flex:1 1 auto; min-height:0; position:relative; }
  iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
  .noframe{ padding:24px 16px; text-align:center; font-size:.9rem; }
  .noframe a{ color:var(--ember); }
  .legal{ flex:0 0 auto; margin:0; padding:10px 16px; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
          background:var(--ash); border-top:1px solid var(--line); font-size:.78rem; line-height:1.5; text-align:center; color:var(--bone); }
  .legal a{ color:var(--bone); text-decoration:underline; text-underline-offset:2px; }
  .legal a:hover{ color:#fff; }
  @media (max-width:420px){ .brand span{ display:none; } .back{ padding:8px 12px; font-size:.78rem; } }
</style>
</head>
<body>
  <div class="bar">
    <a class="brand" href="../index.html">
      <img src="../assets/img/logo.webp" alt="Casa Humo Chiloé" width="34" height="34">
      <span>Casa Humo Chiloé</span>
    </a>
    <a class="back" href="../index.html">Volver al sitio</a>
  </div>
  <div class="frame-wrap">
    <iframe src="https://script.google.com/macros/s/AKfycbxfyXHNaGl8e5pW71JRiO-z7sEqW3CfVbxzVckvH-xO8jqyY6tiCaftxIrY5ZErXjqlZg/exec"
            title="Sistema de reservas de Casa Humo Chiloé"
            loading="eager"
            referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>
  <p class="legal">Al reservar aceptas nuestra <a href="../legal.html#privacidad" target="_blank" rel="noopener">política de privacidad</a> y las <a href="../legal.html#terminos" target="_blank" rel="noopener">condiciones de reserva</a>. Cancelación sin costo hasta 24 horas antes.</p>
  <noscript class="noframe">
    Para reservar necesitas JavaScript activado.
    <a href="https://script.google.com/macros/s/AKfycbxfyXHNaGl8e5pW71JRiO-z7sEqW3CfVbxzVckvH-xO8jqyY6tiCaftxIrY5ZErXjqlZg/exec">Abrir el formulario de reservas</a>.
  </noscript>
</body>
</html>
